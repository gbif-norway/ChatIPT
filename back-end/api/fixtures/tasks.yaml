- model: api.task
  fields:
    name: Manuscript extraction and dataset scoping
    text: |-
      MANUSCRIPT_TASK: This task is required for datasets that include one or more manuscript PDFs.

      Your goals:
      1. Review the attached manuscript PDF directly and summarize what metadata and candidate tables are present.
      2. If multiple candidate datasets/tables were detected, ask the user whether to proceed with one candidate dataset or combine selected candidates.
      3. Keep one publication dataset scope at a time.
      4. If no raw biodiversity table data can be grounded from the PDF, explain clearly what missing source data is required and ask the user to upload additional data/PDF evidence.
      5. Save any key decisions and missing-data notes using SetStructureNotes.

      Rules:
      - Do not fabricate biodiversity records for pdf-only uploads.
      - Prefer tables and facts grounded directly in the attached PDF and user-confirmed scope.
      - If metadata appears trustworthy, set/update EML fields (including manuscript DOI/citation fields) with SetEML.
      - If this scoping step is complete and no blocking clarification is needed, call SetAgentTaskToComplete.

- model: api.task
  fields:
    name: Data structure exploration
    text: |-
      Examine the structure of every uploaded table/file carefully, but keep the investigation bounded.
      Start with one combined Python profile covering every table: shape, non-empty row/column spans, blank separators, repeated/header-like rows, duplicate headers, and compact row-pattern summaries. Show at most five representative records across the entire call.
      After that profile, use at most two targeted Python calls, and only when they resolve a named structural ambiguity. Never print a complete dataframe, repeatedly inspect the same slice, or investigate details that belong to the later content/transformation tasks.
      Write a report on the structure covering the following steps:
        1.  **Data Islands:** Detect distinct, contiguous blocks of data. Pay close attention to empty rows or columns that might separate these islands. Describe the location (e.g., cell ranges) and general appearance of each island. 
        2.  **Structure & Formatting:** For each identified data island, describe its formatting.
            *   Is it a simple table, a crosstab (matrix)? If a crosstab, identify potential row/column headers and data cells.
            *   Are there multiple header rows? How might they be interpreted?
            *   Are there blank cells that look like they should be filled from subheader cells above or to the left?
            *   Note any other structural peculiarities.
        3.  **Note missing data structures:** Follow up on any data which seems to be missing. If there seem to be column headers missing or row headers missing fill these in with the help of the user if necessary.
        4.  **Perform Simple Merges:** If multiple data islands clearly belong together (e.g., a single table split across adjacent cell blocks with identical headers), fix these and note what you have done.
        5.  **Any other notes:** Note anything additional of interest. IMPORTANT - if it looks like there is missing data (e.g. there is a crosstab of species numbers + site locations but species names are missing), be sure to ask the user to upload it.
      When you have completed this to your satisfaction, use the SetStructureNotes tool to save this report to structure_notes, ensuring you capture the full context and any important notes from the user (e.g. if there is missing data). 
      If the user responds in a language other than English, remember to record it using SetUserLanguage.

- model: api.task
  fields:
    name: Data content exploration
    text: |-
      1. Briefly describe the type of data each data island or extracted table (see structure_notes) appears to contain (e.g., "list of species names and counts," "site descriptions," "environmental measurements"), and add this information to the structure_notes (being careful not to overwrite what is there already, use SetStructureNotes). Ask the user about anything which is completely cryptic. Edit column headings as necessary to make the data content clear, and add any necessary info to the structure_notes. 
      2. Generate a concise draft Title (3-5 words) and a short Description (1-5 sentences) for the entire dataset, describing the data itself in general, and save them using SetBasicMetadata.
         - This is mandatory for this task. Do not complete this task without setting title and description.
         - Do not ask the user to provide title/description first. Infer best-effort values from tables, extracted manuscript context, and conversation history.
         - Ask the user only for optional edits/refinements after you have saved a draft.
         - If your first SetBasicMetadata call fails due to missing title/description, immediately retry with generated draft values in the same turn.
      3. Once you have this, please generate additional required metadata described in the SetEML function, as far as it's possible to generate it. You should be the one generating it based on the data but you can check it with the user, and in fact you should ask the user about any metadata you aren't sure of, but allow them to skip this step if they wish. Derive EML fields from the data first wherever possible: temporal_scope from eventDate and/or year/month/day (earliest-latest record dates, not "today" placeholders), geographic_scope from country/state/locality and coordinate bounds, taxonomic_scope from scientificName/taxonomic columns, and methodology from samplingProtocol/method columns. Use the user's name and email address as the contact as per their profile (ask them directly if unsure, even if it means repeating their email). This is the metadata that will get shown when the dataset is published, but it will be edited and refined as the publication process progresses.

- model: api.task
  fields:
    name: Data suitability assessment
    text: |-
      GBIF.org is a global database for biodiversity data. Suitable data for publication:
      1. Species Occurrence Data: WHAT (species/family/order level identification or higher level) / WHEN (columns for year/month/day or date) / WHERE (locality and/or latitude/longitude and/or footprintwkt). Optionally also WHO made the observation. May also be e.g. eDNA data even if the species identification only occurs at a higher taxonomic level.
      2. Checklists: Lists of species thematically linked - usually geographically, but could also be by status, trait or other common factor.All that's required is a scientific name.

      *   Is the data primarily biological (species occurrences, species lists, ecological survey data)?
      *   If the data appears to be non-biological (e.g., purely chemical soil composition, meteorological data without direct biological linkage), clearly explain to the user why it might not be suitable for GBIF and that this tool focuses on biodiversity data. Give the user a chance to respond or upload better source data. Do not mark the dataset as rejected or terminal.
      *   Prompt the user to upload a new file with additional data if necessary. They have access to a paper clip button in the chat interface to do this.
      *   Leave all data transformation and cleaning to the next agent.
      *   If the dataset is clearly suitable, do not ask the user anything, just call SetAgentTaskToComplete.

- model: api.task
  fields:
    name: Data transformation
    text: |-
      Transform the explored and structured data into Darwin Core Data Package (DwC-DP) resources. DwC-DP is the canonical target. A maximally faithful Darwin Core Archive projection will be derived later from the validated DwC-DP, so do not force the data into one DwC-A core plus extensions at this stage.

      Use Table.title to name tables with exact reserved DwC-DP resource names (e.g. "event", "occurrence", "material", "survey", "organism-interaction", "molecular-protocol", "nucleotide-sequence", "nucleotide-analysis", "identification"). Use hyphens, not underscores.

      DECISION-FIRST AND CONTEXT DISCIPLINE (critical):
      - Your goal is to create a sensible package, not to exhaustively describe the source or investigate every possible model.
      - Begin by naming the small number of unresolved decisions that could change source-table authority, the resource graph, event grouping, assertion subjects, important joins, or the interpretation of overloaded fields.
      - Every exploratory Python call must resolve one or more of those named decisions. Do not repeat an inspection unless new evidence contradicts the earlier result.
      - Before either asking the user or making the first package-table write, you have an exploration budget of at most three read-only Python calls in total. Combine related checks. There is no fourth read-only inspection call: after the third, call RequestUserInput if a material domain decision remains; otherwise start building the evidence-based package.
      - Python output becomes part of future model context. Keep it compact: report shapes, aggregate counts, distinct-value summaries, and join cardinalities; show at most five representative records across the entire call, not five per table or group; never print a complete dataframe, wide row, or long list of records; and do not reprint columns already described adequately in structure notes.
      - After a bounded initial assessment, ask the user one grouped, plain-language question as soon as domain knowledge is needed to resolve decisions that would materially change the package. Do not attempt every possible inference first.
      - Make a concise source-authority and transformation plan. For each fact group, identify its authoritative source, target resource, grouping or join rule, and any unresolved question. Then execute it.
      - Once the plan is sufficient, stop exploring representative records. Create the first complete evidence-based relational package, validate it, and make only targeted corrections prompted by validation or genuinely contradictory new evidence.
      - Treat source coverage as one bounded final check, not a new exploration phase. Report represented and explicitly omitted source rows by source table, with a short reason for each omission. Also check the small number of semantically important fact groups identified during planning—especially repeated measurements, quantities, traits, and survey facts—and state where each group went or why it remains unresolved. Save material omissions in SetStructureNotes; avoid turning this into an exhaustive per-column exercise.

      LOOKUP-FIRST RULE (critical):
      - Do not rely on memory for DwC-DP details.
      - First propose the complete evidence-based resource graph from source meaning. During planning, inspect candidate resources with GetDwcDpTableInfo(include_fields=false); group these compact relationship summaries into the smallest practical number of assistant turns.
      - Once the resource graph is selected, request the exact schemas for all selected resources together in one assistant turn, using parallel GetDwcDpTableInfo calls. Set max_fields no higher than 40.
      - A successful field-level lookup remains authoritative for the rest of this task. Do not fetch the same resource schema twice unless validation identifies a specific previously unknown field-level problem.
      - After the batched schema lookup, create the complete evidence-based package in the smallest practical number of Python writes rather than alternating one schema call with one table write.
      - If you later need to reason about the derived DwC-A projection, call GetDarwinCoreInfo/GetDwCExtensionInfo then, not during primary DwC-DP mapping.
      - If a specific unresolved decision leaves two similar resources or fields genuinely plausible, call GetDwcDpTableInfo for those candidates and compare definitions. Do not inspect resources speculatively merely because they exist in the schema.

      DETERMINISTIC EXACT-MATCH FAST PATH:
      - When a source table is already a recognisable standard table and its headers exactly match fields confirmed by GetDwcDpTableInfo, preserve those fields with a direct, deterministic copy. Generate only the required package `_pk`/`_fk` structure and other values that are actually justified by the source.
      - This fast path applies only to exact confirmed fields, not similar-looking names or semantic synonyms. Resource identity, relationships, ambiguous fields, assertions, and any split or aggregation still require the model-led contextual review below.
      - Record which fields used exact-copy handling in the structure notes. This is an optimisation, not permission to bypass validation or the evidence-based-relational-package review.

      DwC-DP-critical structure:
      - Separate concepts only when the source actually represents them and the relationship matters. A flat source can contribute several resources, but it does not imply that every possible Event, Survey, Identification, Agent, Protocol, or assertion resource should be created.
      - Distinguish enforced package keys from preserved source identifiers. Required primary-key fields end in `_pk`; enforced relationship fields end in `_fk`. Populate every required `_pk`/`_fk` and make all enforced relationships resolve to the referenced `_pk`.
      - Weak primary keys such as event.eventID, occurrence.occurrenceID, material.materialEntityID, survey.surveyID, and identification.identificationID are source identifiers. Preserve them when supplied, but do not use them in place of `_pk`/`_fk` package relationships. It is acceptable for a newly minted weak ID and primary key to initially have the same UUID value.
      - Create stable UUIDs where required package keys are absent. Preserve useful local identifiers in the table's weak ID field, identifier tables, or remarks/assertions as appropriate.
      - Relationships must be explicit and resolvable. Examples: occurrence.event_fk -> event.event_pk; material.collectionEvent_fk -> event.event_pk; nucleotide-analysis links event/material/protocol/sequence using its schema's `_fk` fields; organism-interaction.subjectOccurrence_fk -> occurrence.occurrence_pk. Weak links such as relatedOccurrenceID must be preserved but are not enforced package keys.
      - Preserve source identifiers and dataset-level metadata whenever the source supplies them. Source identifiers belong in the matching weak ID, identifier resource, or documented assertion/remarks field; dataset title, description, licence, creators, contacts, citation, geographic/temporal/taxonomic scope, and methodology belong in dataset metadata rather than being silently discarded or copied into every record.

      EVIDENCE-BASED RELATIONAL PACKAGE (critical):
      - Build the complete relational DwC-DP package supported by the source meaning and useful provenance. Represent each real entity, identifier, relationship, and one-to-many structure where its dedicated resource preserves meaning. Normalization is a means, not a goal, so do not create a resource merely because DwC-DP provides one.
      - Start with native fields on the resource they directly describe. Add another resource only when the schema requires it, the source gives that entity its own identifier, it is reused or linked by many records, it represents a real one-to-many relationship, it has its own properties/provenance, or flattening it would lose meaning.
      - Repeated, qualified, measured, or independently sourced facts may justify the matching assertion resource. A single unqualified native property normally does not.
      - In the transformation plan, give one short evidence-based justification for every proposed resource and briefly name plausible resources you intentionally omitted. Challenge synthetic wrapper records, one-protocol-per-observation duplication, and assertion rows that merely repeat an already preserved native field; equally, challenge flattening that would discard a supported entity or relationship.
      - Example: ordinary bird observations with date/location and one current taxon per row may need only event and occurrence when no other entity evidence exists, using occurrence's native scientificName and related taxon fields. Shared sampling events may deduplicate into one event linked to several occurrences. A simple method value can remain a native event field. Identification becomes a separate resource when the source represents a real taxonomic determination or classification beyond those native fields. This is an evidence example, not a target resource count.

      EVENT AND IDENTIFICATION MODELLING (critical):
      - Before creating events, briefly sketch the Event structure supported by the source. Identify the distinct real sampling or observation contexts and any recurring sampling units—such as plots, sites, stations, transects, expeditions, projects, campaigns, visits, samples, or subsamples—and test whether narrower activities repeat within a stable broader context. State why the final Event model is flat or hierarchical.
      - Prefer a hierarchy when the broader and narrower contexts are both evidenced by the source, multiple narrower Events belong unambiguously to the same broader Event, and retaining the relationship explains the sampling structure or prevents broader context being duplicated. A recurring place or label alone is not sufficient. Occurrences that genuinely share place, time, and sampling context should normally share one event. Do not manufacture one wrapper event plus one child event per occurrence merely to mirror the conceptual model.
      - Consider a parent/child Event hierarchy when the source describes genuine broader and narrower activities or contexts and preserving that relationship helps explain how records were produced. Examples include a monitoring programme containing plots and dated surveys, an expedition containing stations and collecting events, a survey campaign containing sites and visits, or an experiment containing runs and subsampling events. These are examples, not templates or trigger phrases.
      - Use parentEvent_fk only when the broader and narrower Events are both supported by source structure, identifiers, metadata, or an unambiguous grouping relationship. Do not create parents merely to group rows or hold duplicated metadata, and do not create one child Event per occurrence unless each occurrence truly represents a distinct Event.
      - Create survey only when the source contains a survey design or evidence about targets, effort, completeness, or non-detection that benefits from survey semantics. An occurrence list collected during fieldwork is not automatically a survey resource.
      - Before creating identification, state what substantive determination each proposed row records. One current scientificName per occurrence normally stays in occurrence. Identification is justified by evidence such as multiple or historical determinations, identificationID, identifiedBy, dateIdentified, identification method/status, a determination based on material, media, or nucleotide analysis, or supplied classification fields that the subject resource cannot represent.
      - Higher-taxonomy preservation is mandatory: when the source supplies populated kingdom, phylum, class, order, family, genus, or lower-classification fields that cannot all be represented on occurrence or another subject resource, create a linked identification and copy every supplied classification field. Never reduce such a row to scientificName alone, and never invent missing ranks.
      - Never create identification rows containing only identification_pk, a foreign key, or blank taxonomic fields. If no substantive identification fact exists, omit the identification resource. During refinement, remove empty or relationship-only identification rows and move any genuinely useful native taxon value back to occurrence when appropriate.

      DEDICATED RESOURCE CANDIDATE REVIEW:
      - Inspect source evidence for useful Identification, Agent/Agent Role, Bibliographic Resource/Reference, Protocol, Usage Policy, and Provenance resources. Create a rich relational package wherever the evidence thresholds below are met, without adding artificial or empty tables. Do not produce a ceremonial include/omit checklist for families with no material evidence.
      - Agent is justified when a person or organization has a stable identifier such as ORCID/ROR, structured attributes, several roles, an ordered/dated role, or is reused across records or resources. An isolated unstructured name may remain in the native literal field.
      - Bibliographic Resource plus a relationship table is justified by structured or reusable references such as DOI, ISBN, URL, or separately described citations. A single unstructured associated-reference literal may remain native.
      - Usage Policy is for entity-level rights, attribution, ownership, access restrictions, or licences, especially when they differ from dataset-level EML licensing. Do not duplicate one uniform dataset licence into every entity.
      - Provenance is for supplied derivation, processing lineage, custody, source-system, or version-specific evidence. Do not manufacture provenance merely to describe ChatIPT's own transformation.
      - Protocol is justified when a reusable method has its own identifier/details or is shared through explicit relationships. A simple isolated method may remain native.
      - Assertions are not a generic overflow destination. Prefer the dedicated entity or relationship when the source describes one; use assertions only for genuine measured, qualified, repeated, or independently sourced facts.

      DATE PRECISION (critical):
      - Preserve exactly the precision supplied by the source: `2010` stays `2010`, `2010-07` stays `2010-07`, and `2010/2011` stays a year-to-year interval. Never use today's month or day as a parser default.
      - Use the provided `normalize_event_date` Python helper. When a value is ambiguous or unsupported, keep the original in verbatimEventDate and leave eventDate blank rather than guessing. Do not treat ambiguous slash dates as intervals without evidence.

      Context-dependent high-risk mappings (easy to misuse):
      - Names vs IDs: fields ending in ID should contain identifiers, not human names.
      - Do not put event/location/date data into occurrence when an event table should exist.
      - Do not publish repeated measurements/assertions as DwC-A MeasurementOrFact during DwC-DP transformation. Use the appropriate `*-assertion` DwC-DP tables.
      - For eDNA/metabarcoding, pay special attention to material, molecular-protocol, nucleotide-sequence, nucleotide-analysis, identification, and occurrence. Preserve sample IDs, target genes/markers, primers, sequencing methods, controls, read counts, total read counts, and sequence/accession data where present.
      - For camera trap/camtrap-like data, pay special attention to event/survey, media, occurrence, and media link tables. Preserve deployment/camera/site/media/observation relationships.
      - For material-focused data, use material as a first-class table, with material assertions, identifiers, media, provenance, usage policy, and references as needed.
      - For interaction data, use organism-interaction as a first-class table, with subject/related occurrence links and organism-interaction-assertion for repeated traits/facts.

      MODEL-LED ASSERTION ROUTING (critical):
      - You are responsible for deciding what every measurement, fact, trait, or assertion describes. Make this decision from the complete dataset context: table structure, identifiers, values, related tables, metadata, and sampling design. Do not use or invent a hard-coded keyword/term classifier.
      - For assertion-like data, first group rows by structural identifiers and meaning. Inspect complete columns or related resources only when needed to decide the asserted subject or verify a join. Summarize groups and cardinalities; do not enumerate every row or every theoretically plausible resource.
      - Group assertion-like source facts into an assertion-routing plan before writing transformation code. For each group, state: source selector, source-row count, and populated-value count; asserted subject resource; exact target table or native resource field; exact source-to-target join; whether the link is explicit, structurally inferred, or unresolved; and the evidence supporting the decision.
      - Once tested, save a concise version of the assertion-routing plan and its row counts with SetStructureNotes so the validation agent can independently reconstruct and challenge it. Update the note if later validation changes the routing.
      - Semantic understanding may determine which resource a fact describes, but it must not invent which specific record it links to. Before creating `_fk` values, test that the proposed join has the cardinality you claim and report unmatched and multiply matched rows.
      - A fact may belong directly in a primary resource when it is a single native property of that resource. Repeated, qualified, measured, or independently sourced facts normally belong in the matching `*-assertion` table. Look up the selected target and only the specific alternatives needed to resolve a real ambiguity.
      - Never discard a row because `occurrenceID` or another familiar identifier is blank. Investigate other identifiers, related tables, metadata, representative values, and structural relationships. If a unique defensible link still cannot be established and the ambiguity materially affects the package, ask the user one focused domain question. If it remains unresolved, keep the source evidence available, mark the group unresolved, record what was tried, and account for it explicitly; do not silently filter it out.
      - Representing a source row does not by itself represent every useful fact on that row. Do not declare a measurement or fact group covered because the same rows produced occurrences or events. If a materially useful group cannot be routed confidently, ask a focused question when the user could resolve it; otherwise preserve it as unresolved and report the limitation rather than silently dropping it.
      - Keep a temporary source-row key while transforming assertion-like data so you can prove unique row coverage across splits, joins, and aggregations. Remove it from final resources if it is not a schema field, but use it for the final coverage checks.

      WHEN TO ASK THE USER ABOUT AMBIGUOUS DATA:
      - Perform a bounded initial assessment first. Ask promptly when the remaining uncertainty would materially change the package and domain knowledge from the user could resolve it. Do not postpone a useful question while attempting increasingly speculative inference.
      - Ask when two or more plausible interpretations would create different resources or relationships; a likely relationship cannot be linked uniquely to a specific record; source values contradict one another or appear to contain a substantive error; or the answer depends on how the data were collected, analysed, or organised.
      - Before omitting a material source group—such as an entire table, a substantive group of populated values, or records whose relationship remains uncertain—tell the user what would be omitted, give the row or value counts, explain why it appears redundant, unusable, or ambiguous, state your recommended treatment, and ask for confirmation in the same grouped question. Do not require confirmation for blank rows, repeated headers, obvious totals, or formatting artifacts, but report those minor exclusions in the final coverage summary.
      - In one focused question, explain what you found with concrete row counts and representative examples, state your current best interpretation, and ask for the missing domain fact in plain language. Do not ask the user to select a Darwin Core table, field, or technical mapping.
      - Do not ask merely because a value is unusual, an optional field is blank, metadata is unavailable, or a defensible interpretation can be established from the source. Biodiversity data can contain legitimate outliers, historical names, local identifiers, and unusual dates. Treat something as suspicious when it is contradictory, impossible, apparently misparsed or misencoded, or materially ambiguous.
      - If the user cannot answer, do not invent a resolution. Preserve the evidence and record the ambiguity, investigation, and unresolved or explicitly omitted rows and values in SetStructureNotes.

      Assertion-routing reasoning examples (examples of investigation, not fixed mappings):
      - A measurement table has biological measurements with `occurrenceID` plus rows with blank `occurrenceID` describing sampling instrument, net width, and sampling-track length. Do not drop the blank rows and do not route them from their labels alone. Inspect the table's other identifiers and the event/survey hierarchy. If they join uniquely to individual sampling events, use event-assertion; if they describe a survey design, consider survey-assertion; if they define a reusable method, consider protocol or an appropriate protocol assertion. Explain the choice and verify the join.
      - A laboratory table contains sample mass, preservation state, read count, sequence quality, and extraction temperature. Use the sample, analysis, protocol, and sequence relationships to decide whether each group describes material, nucleotide-analysis, molecular-protocol, or another resource. The same word can mean different things in different workflows, so base the routing on how the records were produced and linked.
      - A wide source row may contribute native event fields, an occurrence, a material entity, and several assertion rows. Count that source row once for unique source-row coverage while documenting every transformation path separately.

      **Your Process:**
      1. Write a concise source-authority and transformation plan with the unresolved decisions, authoritative source for each fact group, proposed DwC-DP resources, relationship graph, and short reasoning for any material relational candidate that affects the design. Do not enumerate candidate families that have no material evidence. Include the assertion-routing groups described above whenever the source contains measurement, fact, trait, or assertion-like data.
      2. Perform the required GetDwcDpTableInfo lookups before mapping fields.
      3. If a domain ambiguity materially affects the plan, ask the user one grouped question now. Otherwise execute the transformation immediately in a small number of testable Python calls. Do not return to broad exploration after execution begins. Remember to:
          *   Rename columns to exact DwC-DP field names.
          *   Split source data into normalized DwC-DP resources.
          *   Create new ID columns and relationship columns where needed.
          *   Handle structural transformations like unpivoting crosstabs to long format (1 row per observation/record).
          *   Join tables if necessary (e.g., merging a locality lookup table into the main data). Double-check join correctness.
          *   Use normalize_event_date for eventDate values and preserve the original as verbatimEventDate whenever normalization changes it or cannot safely interpret it.
          *   Delete redundant or intermediate tables once their data is incorporated.
      4. Run ValidateDwcDp and fix reported schema, required-field, key, data-type, numeric-constraint, and enforced foreign-key problems before completing this task.
      5. If key values or relationships cannot be inferred safely, follow the focused user-question policy above when the ambiguity materially changes the package. Otherwise leave them blank only when the schema allows it and record the gap in SetStructureNotes (do not invent values).
      6. Run one compact final coverage check against the SOURCE INVENTORY. For every source table report represented rows and explicitly omitted rows; for assertion-like sources also report unmatched and multiply matched join counts. For each semantically important measurement/fact group named in the plan, compare its populated source-value count with its destination count or state that it remains unresolved. Save material omissions, ambiguous routing, and the coverage summary in SetStructureNotes. This is a focused fact-group check, not an audit of every source cell or a per-column routing declaration.
      7. Call SetAgentTaskToComplete. The server will independently re-run current DwC-DP schema, key, type, numeric, and foreign-key validation and will refuse completion if it is not valid.
      8. If your understanding of the dataset changes significantly, update SetBasicMetadata and SetStructureNotes.

- model: api.task
  fields:
    name: Data validation and refinement
    text: |-
      Systematically check the Darwin Core Data Package-transformed data for errors, inconsistencies, relationship problems, and adherence to the DwC-DP standard, then correct these issues. The user is unlikely to be able to judge the correctness of technical fixes, so for these you must use your best judgment. You are expected to resolve issues without user input unless absolutely necessary.

      REVIEWER CANDIDATE REPORT:
      - A compact `RELATIONAL MODELLING CANDIDATES — REVIEWER ATTENTION` report is supplied near the top of the current workflow state. It is a deterministic attention aid, not a modelling decision or completion gate.
      - Prioritize strong candidates in the combined audit and assess them against source meaning and the looked-up DwC-DP schemas. Possible candidates are context only and may remain in native fields or metadata.
      - Do not create a dedicated resource merely to satisfy the report. Do not produce an include/omit checklist for candidate families with no material evidence. When a strong candidate remains flattened for a material semantic reason, record that reason concisely in the existing structure notes.

      LOOKUP-FIRST RULE (critical):
      - Batch GetDwcDpTableInfo for all current DwC-DP tables in one response before deciding a field or relationship is wrong.
      - Do not "fix" DwC-DP terms based on memory alone.
      - A successful lookup is authoritative for this task. Do not repeat it unless the final validator reports a specific schema issue that the first result did not cover.

      BOUNDED VALIDATION LOOP:
      1. In the first response, batch the schema lookups and ValidateDwcDp in parallel.
      2. Run exactly one combined read-only Python audit. It must cover the relevant validation priorities below in a single compact report: keys/links, required and controlled values, date/numeric bounds, semantic duplicates, suspicious mappings, event cardinality, and source-coverage/join exceptions already identified in the saved notes. Print counts and at most five representative records total.
      3. If that audit confirms defects, use at most two targeted Python correction calls. Combine related fixes in each call and report before/after counts. Do not spend successive calls re-inspecting the same anomaly, and do not start an exhaustive per-column coverage phase.
      4. Re-run ValidateDwcDp once after corrections. Recheck source coverage only for groups changed by those corrections, record material changes or unresolved groups in SetStructureNotes, and call SetAgentTaskToComplete. The server independently re-runs validation against the current tables before allowing completion.
      5. Additional investigation beyond this budget is allowed only when ValidateDwcDp still returns a concrete error or a material domain ambiguity would otherwise force unsupported data. In the latter case ask one focused question about the underlying data or collection process; never ask the user to choose a DwC-DP mapping.

      Reconstruct and challenge the model-led routing from the saved plan and the combined audit rather than from keywords. Verify the claimed subject, exact join, join cardinality, unmatched rows, multiply matched rows, and whether a native resource field or `*-assertion` table is the better representation. Never assume blank `occurrenceID` means the row is irrelevant.

      If your understanding of the dataset changes significantly, use SetBasicMetadata to update the Title/Description and SetStructureNotes to update the structure_notes.

      Validation priorities:
      - Evidence-based relational package: challenge every generated resource against the source evidence. Remove unnecessary wrapper entities, duplicated one-per-row protocols/agents, and assertion rows that only repeat a native field. Also detect missing dedicated resources where flattening has lost a real entity, identifier, relationship, provenance, reuse, or one-to-many structure. Resource count is never the optimization target.
      - Event cardinality: check whether events represent distinct source sampling contexts. Collapse synthetic wrapper/child hierarchies and share events across occurrences when place, time, and sampling context are genuinely shared. Keep parent hierarchies and survey resources only when source semantics justify them.
      - Missing Event hierarchy: also check the reverse failure. When several flat Events repeat within the same stable sampling unit or broader activity, determine whether a supported parent Event has been omitted. Add it when the relationship is unambiguous and materially improves the representation; otherwise retain the flat structure and document why.
      - Important-fact preservation: use the saved transformation plan to check the small number of semantically important measurement, quantity, trait, and survey-fact groups. Confirm that representing their source rows did not mask loss of their populated values. A material unresolved group must remain explicitly documented or be corrected; do not require exhaustive per-column bookkeeping.
      - Identification substance: remove identification rows that contain only keys, links, or blank taxonomic content. Prefer occurrence's native scientificName/taxon fields for a lone current name; retain identification resources for real determination history, agents, methods, status, separate evidence, or supplied higher classification that the subject resource cannot represent. Verify that every populated source taxonomy rank is preserved rather than reducing the identification to scientificName.
      - Dedicated-resource review: challenge both under-modelling and over-modelling for the strong candidates surfaced in the reviewer report and any additional material evidence discovered contextually. Do not replace a supported dedicated entity with a generic assertion, and do not add a resource solely because a possible candidate was surfaced.
      - DwC-DP required fields: ensure required `_pk` identifiers and required `_fk` relationship fields are present and populated. Do not confuse weak source IDs with enforced package keys.
      - Projection identifier readiness: resolve case-insensitive duplicate warnings for weak primary keys such as occurrenceID before completion. When a supplied value identifies several distinct records or is not actually an identifier, mint stable unique weak IDs from the enforced `_pk` values and preserve the original source value in an appropriate source/provenance field or remarks.
      - Formats and numeric bounds: preserve source precision in eventDate/date fields and never fill missing components from the current date; also check lat/long ranges, positive counts/areas/durations/read counts where applicable, and numeric coercion sanity.
      - Controlled/enum-like values: occurrenceStatus, survey completeness/reporting flags, assertion fields, media fractions, and any controlled fields actually used.
      - Link integrity: all populated foreign keys must resolve to records in the referenced DwC-DP resource.
      - Domain-specific review: for eDNA/metabarcoding, inspect material/protocol/sequence/analysis linkage; for camtrap data, inspect event/survey/media/occurrence linkage; for material datasets, inspect material/event/occurrence evidence links; for interactions, inspect subject and related occurrence links.
      - Assertion-routing review: compare every assertion-like source group with all generated `*-assertion` and relevant native-resource fields. Confirm the model's semantic decision from dataset context and independently test the specific record linkage and source-row coverage.
      - Consistency and hygiene: scientificName/locality normalization, whitespace/case cleanup, mixed-type cleanup, duplicate ID handling.

      Your goal is to produce the cleanest, most compliant dataset possible, using your AI judgment to resolve issues autonomously.

- model: api.task
  fields:
    name: Phylogenetic tree linking
    text: |-
      TREE_LINKING_TASK: This task links phylogenetic tree tips to DwC-DP records and preserves enough information for the later DwC-A projection.
      
      You have been provided with tree file information above, including:
      - A preview of the tree file content (first 500 characters)
      - A list of parsed tip labels from the tree
      
      Your job is to carefully inspect the format of the tree tip labels and figure out how to match them to records in your occurrence or taxon table. Tree tip labels come in many different formats - some examples:
      - Direct species names: "Berneuxia_thibetica_01" → matches "Berneuxia thibetica"
      - Abbreviated codes: "MENALB912C" → "MEN" (genus), "ALB" (species), "912" (possible voucher number/lab number/collector number/something else)
      NB - common abbreviated code for botany datasets is Collector surname + initial + collector number e.g. "GuppyA513" → "Guppy" (surname), "A" (initial), "513" (collector number)
      - Sample IDs: "SRR7451102" → matches a sample/accession ID in the data
      - Various other custom formats depending on the researcher
      
      STEPS:
      1. **Analyze the tree tip format**: Look at the tip labels and compare them to the data in your core table. What columns might they match to? (scientificName, catalogNumber, occurrenceID, a custom ID column, etc.)
      
      2. **Write Python code to do the matching**: Create code that:
         - Parses/decodes the tip labels as needed
         - Matches them to records in the core DataFrame
         - Prefer adding a valid DwC-DP assertion table linked to the relevant occurrence/material/identification record where possible.
         - If the final DwC-A projection will need tree-specific facts that do not map cleanly to DwC-A terms, you may also add or update `dynamicProperties` on the occurrence projection source with phylogeny info in this format:
           `{"phylogenies": [{"phyloTreeTipLabel": "MENALB912C", "phyloTreeFileName": "108_ASTRAL.tre"}]}`
      
      3. **Report matching statistics**:
         - How many records in the DataFrame have been matched to tree tips?
         - How many records have NOT been matched?
         - How many tree tips do NOT have a matching record?
      
      4. **Handle edge cases**:
         - If you cannot figure out how to programmatically match the tree tips, explain this to the user and ask for their help understanding the encoding scheme
         - If some tips can't be matched, let the user know which ones
      
      5. **Iterate with the user**: Continue the dialogue until the user is satisfied with the tree-to-record linkage. They may provide additional context about how the tip labels were constructed.
      
      IMPORTANT: The tree file itself will be included in the final DwC-A projection when possible. Your job is to set up stable DwC-DP linkages and, only where needed, projection-friendly dynamicProperties so occurrence/material/identification records can be associated with their corresponding tree tips.

- model: api.task
  fields:
    name: Publication package preparation
    text: |-
      PACKAGE_PREPARATION_TASK: Build the authoritative DwC-DP and its DwC-A publication projection. Do not request publication approval and do not publish in this task.

      Your subtasks:
      1.  **Complete draft metadata:** Check and edit metadata as necessary. If title or description is missing, generate the best supported value from the data and saved context instead of asking the user to write it. Leave user-facing metadata confirmation to the quality gate.
      2.  **Create and validate publication packages:**
          *   Run ValidateDwcDp. Fix any DwC-DP schema, required-field, unique-ID, numeric-constraint, or foreign-key issues before exporting. Treat warnings about duplicate weak primary identifiers used by the DwC-A core as issues to resolve before export.
          *   Optionally call PreviewDwcDpDescriptor if you need to inspect the generated datapackage.json before export.
          *   Call ExportDwcDp. This is the authoritative package.
          *   Before deriving DwC-A, review the saved coverage of semantically important fact groups. If a material measurement, quantity, trait, or survey-fact group was silently omitted or treated as covered only because its rows produced another resource, correct the DwC-DP routing or ask one focused user question. Do not turn this into an exhaustive per-column coverage exercise.
          *   Build the most faithful standards-compliant DwC-A projection the archive format permits. Preserve every useful DwC-DP fact that can be expressed safely through the selected core, compatible extensions, or intelligible projection-only `dynamicProperties`, without inventing facts or misusing terms.
          *   Choose the focal core first by stating in a few words what the data are fundamentally about. Survey design, repeated sampling, effort, completeness, non-detection, or a meaningful Event hierarchy normally favours Event core; individual specimens or observations without meaningful survey context normally favour Occurrence core; a checklist or taxonomic treatment normally favours Taxon core. Use the actual DwC-DP graph and source meaning, not keywords alone.
          *   Call GetDarwinCoreInfo for the candidate core and call GetDwCExtensionInfo without parameters to inspect the structured extension catalogue. Consider only extensions compatible with the chosen core. Then call GetDwCExtensionInfo for every extension you intend to use, and call it again with the exact candidate `terms` to inspect their registered definitions before mapping fields.
          *   Use a core term first when its definition exactly expresses the fact. Select an extension only when it contributes at least one meaningful non-key fact, its subject and terms match the source meaning, and every extension row can link unambiguously to one core record. Do not add an extension for identifiers alone, placeholder rows, duplicated core values, or merely because it might be relevant.
          *   Do not force data into an inexact core or extension term. If useful DwC-DP facts cannot be represented safely, keep them authoritative in DwC-DP and report the projection limitation. Use projection-only `dynamicProperties` only as a fallback for unambiguous per-core facts that remain intelligible there.
          *   With Event core, an Occurrence extension is often appropriate when meaningful linked organism records exist. Consider the Humboldt Ecological Inventory extension when the source or authoritative DwC-DP explicitly supplies matching survey design, scope, protocol, effort, completeness, abundance, or non-detection facts. An Event hierarchy is a reason to inspect those facts, not sufficient evidence by itself. Map each Humboldt value from identified evidence. Never infer survey properties from detected occurrences merely to populate fields. Lossless normalisation such as safe date formatting is allowed, but do not invent ecological or methodological facts.
          *   For media, prefer Audiovisual Core when rich technical, spatial, temporal, taxonomic, rights, service, or region-of-interest metadata are available; use Simple Multimedia for basic links and Dublin Core metadata. Prefer Extended Measurement or Fact over MeasurementOrFact only when its vocabulary identifier fields or occurrence link preserve additional meaning. Consider GGBN extensions only for an Occurrence that represents a material sample, and link every laboratory, preparation, preservation, permit, loan, or gel record back to that occurrence without guessing.
          *   Inspect every populated DwC-DP resource and account for compatible facts. Use every compatible extension needed to preserve meaning, while avoiding redundant or empty extensions and never inventing extension terms.
          *   Use Python to create temporary non-DwC-DP projection tables for the final core and extensions. Do not alter the authoritative schema-valid DwC-DP resource tables. Keep the temporary projection tables available for the quality gate; they are removed when that gate completes.
          *   Each extension table must have a dedicated `_coreid` column. Resolve `_coreid` through the validated DwC-DP graph so every value exactly matches the selected core table identifier. Check join cardinality and unmatched rows before upload.
          *   For every populated DwC-DP resource, record whether its compatible facts were represented in the core, represented in an extension, preserved in `dynamicProperties`, or could not be projected. Give exact row/field counts and a reason for anything not represented. Silent omission is an error.
          *   Explicitly summarize every material source group omitted from the authoritative DwC-DP, including row or populated-value counts, the reason, and whether the user confirmed it. Minor exclusions such as blank rows, repeated headers, obvious totals, and formatting artifacts may be grouped into one short summary.
          *   Call UploadDwCA with the temporary core table and explicit extension assignments (`table_id`, `extension_type`, and `core_id_column`).
          *   Never add DwC-A-only fields such as basisOfRecord directly to a DwC-DP resource when GetDwcDpTableInfo does not list them. The authoritative DwC-DP tables must remain schema-valid after projection and validation.
          *   Add the projection decisions, coverage, and package URLs to structure_notes for the independent quality gate.
      Finish this task only after both package URLs exist, the authoritative DwC-DP validates, projection coverage and omissions are recorded in structure_notes, and the current DwC-A can be handed to the independent quality gate. Do not ask for publication approval here.

- model: api.task
  fields:
    name: Pre-publication quality gate
    text: |-
      QUALITY_GATE_TASK: Independently assess the completed publication artifacts. This is a blocking review between package preparation and user approval. Do not publish in this task.

      1. **Perform one combined source-to-publication audit:**
         * Compare the original uploaded tables/files, authoritative DwC-DP resources, DwC-A core/extensions, and exported EML.
         * Reconcile source rows and materially useful populated fact groups with the authoritative package and projection. Confirm joins, identifiers, core/extension links, occurrence status/count consistency, and every deliberate omission.
         * For every deduplicated or aggregated entity, verify that the source establishes identity. Identical payloads, a shared locality, or identical missing values are not sufficient evidence that records represent the same event or entity.
         * For every non-trivial source-to-target mapping, compare the source header and representative values with the authoritative definition of the destination term. Exact value preservation does not make a semantically incorrect mapping valid. Keep table descriptions consistent with the final transformed content.
         * Inspect the actual exported archive, not only Dataset.eml or temporary projection tables. Confirm that title, description, creators, contact details, licence, temporal/geographic/taxonomic scope, and methodology survive into EML where supported.
         * Check for invented precision or unsupported inference. In particular, month-only and year-only dates must remain at that precision; coordinate signs/hemispheres, datum, country, and locality must be mutually consistent; placeholders such as `unknown@example.org` must not appear as real metadata.
         * Review taxon matches and spelling, coordinate interpretation, controlled vocabularies, record counts, uniqueness, and relationship resolution.

      2. **Resolve findings before completion:**
         * Treat broken links, non-indexable archives, invalid or probably mislocated coordinates, likely spelling errors causing unmatched taxa, invented date precision, missing required contacts, metadata loss, and unexplained material omissions as blocking.
         * Ask the user one consolidated, plain-language set of questions when source knowledge or approval is required. Do not ask separately about symptoms that share one cause.
         * A taxon genuinely absent from the GBIF backbone or another unavoidable validator issue may be accepted only when it is supported by source evidence and explicitly acknowledged by the user. Record the reason in structure_notes.
         * Apply confirmed corrections to the authoritative data or metadata as appropriate. Rebuild both affected packages, then rerun the relevant internal validation.

      3. **Confirm final metadata:**
         * Present the clean title, description, creators/contact, licence, scopes, methodology, material omissions, and remaining non-blocking limitations for optional edits before completing this task.
         * If the user requests an edit, apply it and rebuild the affected packages before continuing.

      4. **Run the final external check:**
         * Only after the audit, corrections, metadata confirmation, and final archive rebuild, call ValidateDwCA for the current archive and continue polling the same validation key until the result is finished.
         * The task cannot complete unless GBIF reports that this exact current archive is indexable.
         * Interpret every validator issue. Do not equate "indexable" with publication-ready. If validation requires another correction, rebuild the affected packages and start a new validation for the replacement archive.
         * Record a concise readiness report in structure_notes: checks performed, issues found, fixes made, remaining non-blocking limitations, explicit user acknowledgements, and the final GBIF validator key/status.

      Complete this task only when there are no unresolved blockers, the current archive has a finished indexable GBIF validation, final metadata has been checked, and temporary DwC-A projection tables can be removed. Do not request publication approval and do not call PublishToGBIF.

- model: api.task
  fields:
    name: Final Review & Publication
    text: |-
      FINAL_PUBLICATION_TASK: The packages have already been built and passed the pre-publication quality gate. Do not transform data, rebuild packages, or repeat technical review in this task.

      1. Briefly show the user the final dataset title, description, licence, package links, material omissions, and any non-blocking limitations recorded by the quality gate.
      2. Explain that publication is to the GBIF sandbox, where the dataset becomes publicly visible in the test system, not production gbif.org. Production publication requires contacting helpdesk@gbif.no with the sandbox dataset URL.
      3. Tell the user that the default licence is CC BY 4.0 (`http://creativecommons.org/licenses/by/4.0/legalcode`) unless the quality gate recorded another confirmed licence.
      4. Ask one consolidated question for final publication approval. Do not ask the user to reconfirm technical decisions already settled in the quality gate.
      5. Only after explicit approval, call PublishToGBIF. Report the GBIF sandbox URL and DwC-DP URL on success, or report the publication error clearly.

      If the user requests any data or metadata change instead of approving publication, do not publish. Explain that the package must return through preparation and quality validation before approval; log the requested change for a developer rather than editing a validated artifact in this final task.

- model: api.task
  fields:
    name: Data maintenance
    text: |-
      MAINTENANCE_TASK: You are editing an already loaded dataset. Use the digest below to understand current tables and metadata. FIRST WAIT FOR USER INPUT, then make any requested changes to tables and metadata. Keep IDs stable where possible (occurrenceID, taxonID) unless the user asks otherwise. Re-run validation after changes. Update structure_notes with a concise changelog. It is not possible to publish to the production gbif.org from our system - if they want to do this they need to get in touch with helpdesk@gbif.no with their sandbox dataset URL. 
